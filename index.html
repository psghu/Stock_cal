<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>股票买入股数计算器</title>
    <meta
      name="description"
      content="输入资产总和、股价和目标仓位百分比，快速计算可以买入多少股。"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f1e7;
        --paper-strong: #fffaf0;
        --ink: #19211f;
        --muted: #64706b;
        --line: rgba(25, 33, 31, 0.16);
        --line-strong: rgba(25, 33, 31, 0.26);
        --field: rgba(255, 250, 240, 0.92);
        --green: #0f7a5a;
        --green-dark: #0b5f47;
        --red: #b34035;
        --amber: #cf7d19;
        --blue: #315f8f;
        --shadow: 0 24px 70px rgba(31, 41, 35, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(115deg, rgba(15, 122, 90, 0.11), transparent 34%),
          linear-gradient(245deg, rgba(207, 125, 25, 0.14), transparent 31%),
          repeating-linear-gradient(
            90deg,
            rgba(25, 33, 31, 0.035) 0,
            rgba(25, 33, 31, 0.035) 1px,
            transparent 1px,
            transparent 72px
          ),
          var(--paper);
        color: var(--ink);
        font-family:
          "Avenir Next",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
        gap: 22px;
        align-items: stretch;
      }

      .masthead,
      .panel {
        border: 1px solid var(--line);
        background: rgba(255, 250, 240, 0.76);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .masthead {
        min-height: 660px;
        padding: 34px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        position: relative;
        overflow: hidden;
      }

      .masthead::before {
        content: "";
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(25, 33, 31, 0.1);
        pointer-events: none;
      }

      .brandline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        position: relative;
        z-index: 1;
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        background: var(--ink);
        color: var(--paper-strong);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        line-height: 1;
      }

      .storage-note {
        color: var(--muted);
        font-size: 14px;
      }

      .hero {
        align-self: center;
        position: relative;
        z-index: 1;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: clamp(42px, 7vw, 86px);
        line-height: 0.94;
        font-weight: 700;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      h1 span {
        display: block;
      }

      .subtitle {
        max-width: 620px;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }

      .ticker {
        display: grid;
        gap: 8px;
        position: relative;
        z-index: 1;
      }

      .ticker-row {
        display: grid;
        grid-template-columns: 78px 1fr 62px;
        gap: 12px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
      }

      .bar {
        height: 8px;
        background:
          linear-gradient(90deg, var(--green) var(--fill), transparent 0),
          rgba(25, 33, 31, 0.1);
        border: 1px solid rgba(25, 33, 31, 0.08);
      }

      .panel {
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .section-title span {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .form {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .field input {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line-strong);
        background: var(--field);
        color: var(--ink);
        border-radius: 0;
        padding: 0 16px;
        font-size: 20px;
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background-color 160ms ease;
      }

      .field input:focus {
        border-color: var(--green);
        background: var(--paper-strong);
        box-shadow: 0 0 0 4px rgba(15, 122, 90, 0.12);
      }

      .presets {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .preset {
        min-height: 42px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 250, 240, 0.68);
        color: var(--ink);
        cursor: pointer;
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background-color 140ms ease,
          color 140ms ease;
      }

      .preset:hover {
        transform: translateY(-1px);
        border-color: var(--green);
      }

      .preset.active {
        background: var(--green);
        border-color: var(--green);
        color: var(--paper-strong);
      }

      .results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .metric {
        min-height: 92px;
        border: 1px solid var(--line);
        background: rgba(255, 250, 240, 0.62);
        padding: 14px;
        display: grid;
        align-content: space-between;
        gap: 10px;
      }

      .metric.primary {
        grid-column: 1 / -1;
        background: var(--ink);
        color: var(--paper-strong);
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
      }

      .metric.primary .metric-label {
        color: rgba(255, 250, 240, 0.66);
      }

      .metric-value {
        font-variant-numeric: tabular-nums;
        font-size: 24px;
        line-height: 1.05;
        overflow-wrap: anywhere;
      }

      .metric.primary .metric-value {
        font-size: clamp(40px, 9vw, 62px);
        font-weight: 800;
      }

      .hint {
        min-height: 44px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .hint.error {
        color: var(--red);
      }

      .hint.warn {
        color: var(--amber);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }

      .ghost {
        min-height: 40px;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--ink);
        padding: 0 14px;
        cursor: pointer;
      }

      .ghost:hover {
        border-color: var(--red);
        color: var(--red);
      }

      .disclaimer {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .page {
          width: min(calc(100% - 24px), 720px);
          padding: 18px 0;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .masthead {
          min-height: 360px;
          padding: 26px;
        }

        .subtitle {
          font-size: 16px;
        }
      }

      @media (max-width: 520px) {
        .brandline,
        .section-title,
        .actions {
          align-items: flex-start;
          flex-direction: column;
        }

        .panel {
          padding: 18px;
        }

        .results {
          grid-template-columns: 1fr;
        }

        .presets {
          grid-template-columns: repeat(2, 1fr);
        }

        .ticker-row {
          grid-template-columns: 58px 1fr;
        }

        h1 {
          font-size: clamp(40px, 13vw, 52px);
          line-height: 1.02;
        }

        .subtitle {
          font-size: 15px;
          word-break: break-all;
        }

        .ticker-row span:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="shell">
        <section class="masthead" aria-labelledby="page-title">
          <div class="brandline">
            <div class="mark" aria-hidden="true">¥</div>
            <div class="storage-note" id="storageNote">本地记住资产总值和仓位</div>
          </div>

          <div class="hero">
            <h1 id="page-title"><span>股票买入股数</span><span>计算器</span></h1>
            <p class="subtitle">
              输入资产、股价和仓位。<br />
              快速得到可买股数、花费和现金。
            </p>
          </div>

          <div class="ticker" aria-hidden="true">
            <div class="ticker-row">
              <span>Position</span>
              <span class="bar" style="--fill: 30%"></span>
              <span>30%</span>
            </div>
            <div class="ticker-row">
              <span>Cash</span>
              <span class="bar" style="--fill: 70%"></span>
              <span>70%</span>
            </div>
            <div class="ticker-row">
              <span>Unit</span>
              <span class="bar" style="--fill: 100%"></span>
              <span>1 股</span>
            </div>
          </div>
        </section>

        <section class="panel" aria-label="计算器">
          <div class="section-title">
            <h2>买入计算</h2>
            <span>按 1 股向下取整</span>
          </div>

          <form class="form" id="calculatorForm" novalidate>
            <div class="field">
              <label for="totalAssets">
                <span>资产总和</span>
                <span>人民币 / 元</span>
              </label>
              <input
                id="totalAssets"
                name="totalAssets"
                inputmode="decimal"
                type="number"
                min="0"
                step="0.01"
                placeholder="例如 10000"
                autocomplete="off"
              />
            </div>

            <div class="field">
              <label for="stockPrice">
                <span>当前股价</span>
                <span>每股价格</span>
              </label>
              <input
                id="stockPrice"
                name="stockPrice"
                inputmode="decimal"
                type="number"
                min="0"
                step="0.01"
                placeholder="例如 23.50"
                autocomplete="off"
              />
            </div>

            <div class="field">
              <label for="targetPercent">
                <span>目标买入仓位</span>
                <span>0 - 100%</span>
              </label>
              <input
                id="targetPercent"
                name="targetPercent"
                inputmode="decimal"
                type="number"
                min="0"
                max="100"
                step="0.1"
                placeholder="例如 30"
                autocomplete="off"
              />
            </div>

            <div class="presets" aria-label="仓位快捷选择">
              <button class="preset" type="button" data-percent="5">5%</button>
              <button class="preset" type="button" data-percent="10">10%</button>
              <button class="preset" type="button" data-percent="20">20%</button>
              <button class="preset" type="button" data-percent="30">30%</button>
            </div>
          </form>

          <div class="results" aria-live="polite">
            <div class="metric primary">
              <div class="metric-label">可以买入</div>
              <div class="metric-value" id="sharesResult">0 股</div>
            </div>
            <div class="metric">
              <div class="metric-label">预计花费</div>
              <div class="metric-value" id="costResult">¥0.00</div>
            </div>
            <div class="metric">
              <div class="metric-label">剩余现金</div>
              <div class="metric-value" id="cashResult">¥0.00</div>
            </div>
            <div class="metric">
              <div class="metric-label">实际仓位</div>
              <div class="metric-value" id="actualPercentResult">0.00%</div>
            </div>
            <div class="metric">
              <div class="metric-label">目标预算未用</div>
              <div class="metric-value" id="unusedResult">¥0.00</div>
            </div>
          </div>

          <div class="hint" id="message">
            输入资产总和、股价和目标仓位后，会自动计算买入股数。
          </div>

          <div class="actions">
            <button class="ghost" id="clearSaved" type="button">清除记录</button>
            <p class="disclaimer">
              仅作计算参考，不构成投资建议；未计入手续费、税费、滑点、融资融券或实时行情。
            </p>
          </div>
        </section>
      </div>
    </main>

    <script>
      const storageKeys = {
        totalAssets: "stock-calculator.totalAssets",
        targetPercent: "stock-calculator.targetPercent",
      };

      const elements = {
        form: document.querySelector("#calculatorForm"),
        totalAssets: document.querySelector("#totalAssets"),
        stockPrice: document.querySelector("#stockPrice"),
        targetPercent: document.querySelector("#targetPercent"),
        presets: [...document.querySelectorAll(".preset")],
        sharesResult: document.querySelector("#sharesResult"),
        costResult: document.querySelector("#costResult"),
        cashResult: document.querySelector("#cashResult"),
        actualPercentResult: document.querySelector("#actualPercentResult"),
        unusedResult: document.querySelector("#unusedResult"),
        message: document.querySelector("#message"),
        clearSaved: document.querySelector("#clearSaved"),
        storageNote: document.querySelector("#storageNote"),
      };

      const moneyFormatter = new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      const numberFormatter = new Intl.NumberFormat("zh-CN", {
        maximumFractionDigits: 0,
      });

      function parseNumber(value) {
        if (value === "" || value === null || value === undefined) {
          return NaN;
        }
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : NaN;
      }

      function clampPercent(value) {
        if (!Number.isFinite(value)) {
          return value;
        }
        return Math.min(100, Math.max(0, value));
      }

      function setMessage(text, type = "") {
        elements.message.textContent = text;
        elements.message.className = type ? `hint ${type}` : "hint";
      }

      function savePreferences() {
        const totalAssets = elements.totalAssets.value.trim();
        const targetPercent = elements.targetPercent.value.trim();

        if (totalAssets) {
          localStorage.setItem(storageKeys.totalAssets, totalAssets);
        } else {
          localStorage.removeItem(storageKeys.totalAssets);
        }

        if (targetPercent) {
          localStorage.setItem(storageKeys.targetPercent, targetPercent);
        } else {
          localStorage.removeItem(storageKeys.targetPercent);
        }
      }

      function syncPresetState(percent) {
        elements.presets.forEach((button) => {
          button.classList.toggle("active", button.dataset.percent === String(percent));
        });
      }

      function resetResults() {
        elements.sharesResult.textContent = "0 股";
        elements.costResult.textContent = moneyFormatter.format(0);
        elements.cashResult.textContent = moneyFormatter.format(0);
        elements.actualPercentResult.textContent = "0.00%";
        elements.unusedResult.textContent = moneyFormatter.format(0);
      }

      function calculate({ persist = true } = {}) {
        const totalAssets = parseNumber(elements.totalAssets.value);
        const stockPrice = parseNumber(elements.stockPrice.value);
        const rawPercent = parseNumber(elements.targetPercent.value);
        const targetPercent = clampPercent(rawPercent);

        if (Number.isFinite(rawPercent) && rawPercent !== targetPercent) {
          elements.targetPercent.value = String(targetPercent);
        }

        syncPresetState(targetPercent);
        if (persist) {
          savePreferences();
          elements.storageNote.textContent = "已保存本地记录";
        }

        if (!Number.isFinite(totalAssets) && !Number.isFinite(stockPrice) && !Number.isFinite(targetPercent)) {
          resetResults();
          setMessage("输入资产总和、股价和目标仓位后，会自动计算买入股数。");
          return;
        }

        if (!Number.isFinite(totalAssets) || totalAssets <= 0) {
          resetResults();
          setMessage("资产总和必须大于 0。", "error");
          return;
        }

        if (!Number.isFinite(stockPrice) || stockPrice <= 0) {
          resetResults();
          setMessage("当前股价必须大于 0。", "error");
          return;
        }

        if (!Number.isFinite(targetPercent)) {
          resetResults();
          setMessage("请输入目标买入仓位百分比。", "error");
          return;
        }

        const targetBudget = totalAssets * (targetPercent / 100);
        const shares = Math.floor(targetBudget / stockPrice);
        const estimatedCost = shares * stockPrice;
        const remainingCash = Math.max(0, totalAssets - estimatedCost);
        const actualPercent = totalAssets > 0 ? (estimatedCost / totalAssets) * 100 : 0;
        const unusedBudget = Math.max(0, targetBudget - estimatedCost);

        elements.sharesResult.textContent = `${numberFormatter.format(shares)} 股`;
        elements.costResult.textContent = moneyFormatter.format(estimatedCost);
        elements.cashResult.textContent = moneyFormatter.format(remainingCash);
        elements.actualPercentResult.textContent = `${actualPercent.toFixed(2)}%`;
        elements.unusedResult.textContent = moneyFormatter.format(unusedBudget);

        if (targetPercent === 0) {
          setMessage("目标仓位为 0%，本次不建议买入。");
          return;
        }

        if (shares === 0) {
          setMessage("目标买入金额不足以买入 1 股。", "warn");
          return;
        }

        setMessage(
          `目标预算 ${moneyFormatter.format(targetBudget)}，按当前股价可买入 ${numberFormatter.format(shares)} 股。`
        );
      }

      function restorePreferences() {
        const savedAssets = localStorage.getItem(storageKeys.totalAssets);
        const savedPercent = localStorage.getItem(storageKeys.targetPercent);

        if (savedAssets !== null) {
          elements.totalAssets.value = savedAssets;
        }

        if (savedPercent !== null) {
          elements.targetPercent.value = savedPercent;
        } else {
          elements.targetPercent.value = "30";
        }

        const hasSaved = savedAssets !== null || savedPercent !== null;
        elements.storageNote.textContent = hasSaved ? "已恢复本地记录" : "本地记住资产总值和仓位";
      }

      elements.form.addEventListener("input", calculate);

      elements.presets.forEach((button) => {
        button.addEventListener("click", () => {
          elements.targetPercent.value = button.dataset.percent;
          calculate();
        });
      });

      elements.clearSaved.addEventListener("click", () => {
        localStorage.removeItem(storageKeys.totalAssets);
        localStorage.removeItem(storageKeys.targetPercent);
        elements.totalAssets.value = "";
        elements.targetPercent.value = "30";
        elements.storageNote.textContent = "本地记录已清除";
        calculate({ persist: false });
      });

      restorePreferences();
      calculate({ persist: false });
    </script>
  </body>
</html>
